<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instagram Capture UI Smoke Fixture</title>
    <style>
      body { margin: 0; min-height: 100vh; background: #09090b; color: #fafafa; font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 720px; margin: 80px auto; padding: 24px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Instagram Capture UI Smoke Fixture</h1>
      <p>This local fixture exercises the isolated Shadow DOM interface.</p>
      <button id="media-browser" type="button">Test Media Folder Browser</button>
    </main>
    <script type="module">
      import { createAppUi } from "../../src/ui/app-ui.js";

      const ui = createAppUi();
      const captureItem = Object.freeze({
        author: "fixture-author",
        contentType: "carousel",
        mediaCount: 3,
        proposedTitle: "Fixture capture title",
      });
      ui.setCaptureAvailable(true, async () => {
        const result = await ui.showCaptureOptions({
          captureItem,
          warnings: ["Fixture warning"],
          defaultMode: "obsidian",
        });
        if (result) ui.notify(result.mode + ": " + result.title);
      }, "Save Carousel");

      const attachments = { kind: "directory", name: "Attachments" };
      const vault = { kind: "directory", name: "Fixture Vault" };
      const fileSystem = {
        async getDirectoryPath(root, segments) {
          return segments.length ? attachments : root;
        },
        async listDirectories(handle) {
          return handle === vault
            ? [{ name: "Attachments", handle: attachments }]
            : [];
        },
      };
      document.getElementById("media-browser").addEventListener("click", async () => {
        const result = await ui.chooseVaultFolder({
          rootHandle: vault,
          fileSystem,
          title: "Choose parent for Media",
          allowRoot: false,
        });
        if (result) ui.notify("media-parent: " + result.segments.join("/"));
      });
    </script>
  </body>
</html>
